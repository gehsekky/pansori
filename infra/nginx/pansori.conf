# Pansori's site file for the shared edge proxy.
#
# The proxy (edge-nginx) is defined in gehsekky-infra under host/edge/ and
# serves every site on the instance. This file is installed to
# /opt/edge/sites/pansori.conf with gehsekky-infra's host/edge/push.sh,
# which runs `nginx -t` before reloading. Pansori's deploy doesn't copy it.
#
# Assumes:
#   - Let's Encrypt certs at /etc/letsencrypt/live/pansorirpg.com/
#   - pansori-frontend (port 80) and pansori-backend (port 3001) on the
#     shared `edge` Docker network
#
# Upstreams sit in variables so Nginx resolves them per request (resolver set
# in the base config). If a Pansori container is down, its routes return 502
# instead of stopping the proxy for every site.

server {
    listen 80;
    server_name pansorirpg.com www.pansorirpg.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name pansorirpg.com www.pansorirpg.com;
    http2 on;

    set $pansori_backend  http://pansori-backend:3001;
    set $pansori_frontend http://pansori-frontend:80;

    ssl_certificate     /etc/letsencrypt/live/pansorirpg.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pansorirpg.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;

    # API — proxy to backend container
    location /api/ {
        proxy_pass         $pansori_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Socket.io — WebSocket upgrade
    location /socket.io/ {
        proxy_pass         $pansori_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }

    # Frontend — proxy to frontend nginx container (SPA, handles its own fallback)
    location / {
        proxy_pass       $pansori_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
